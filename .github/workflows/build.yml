name: Build

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build osu.Game.Rulesets.Fposu -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: osu.Game.Rulesets.Fposu
          path: osu.Game.Rulesets.Fposu/bin/Release/net10.0/osu.Game.Rulesets.Fposu.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" osu.Game.Rulesets.Fposu/bin/Release/net10.0/osu.Game.Rulesets.Fposu.dll --title "${{ github.ref_name }}" --generate-notes
